  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #020406;
      --bg2: #070b10;
      --white: #f5f8fc;
      --silver: #aeb8c4;
      --muted: #687481;
      --blue: #55cfff;
      --blue2: #168dcc;
      --line: rgba(120,210,255,.18);
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: "Manrope", sans-serif;
      overflow: hidden;
    }

    a {
      text-decoration: none;
    }

    /* =========================
       MAIN
    ========================= */

    .landing {
      width: 100%;
      height: 100vh;
      height: 100svh;

      position: relative;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(36,163,225,.13) 0%,
          rgba(36,163,225,.055) 18%,
          transparent 43%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(30,132,190,.08),
          transparent 40%
        ),
        linear-gradient(
          145deg,
          #010203,
          #06090d 50%,
          #010203
        );
    }

    /* =========================
       BACKGROUND LIGHT
    ========================= */

    .light {
      position: absolute;

      width: 520px;
      height: 520px;

      left: 50%;
      top: 43%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(42,176,240,.045);

      filter: blur(85px);

      pointer-events: none;
    }

    /* =========================
       TECH RINGS
    ========================= */

      left: 50%;
      top: 43%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      pointer-events: none;

      border: 1px solid rgba(82,198,245,.045);
    }
