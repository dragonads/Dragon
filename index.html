<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRAGON HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#090909;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 18px;
    position:relative;
    overflow:hidden;
}

/* subtle background */
.page::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    filter:blur(100px);
    top:-180px;
    right:-150px;
}

.page::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,255,255,.025);
    filter:blur(90px);
    bottom:-180px;
    left:-150px;
}

.card{
    width:100%;
    max-width:460px;
    position:relative;
    z-index:2;

    padding:12px;

    border-radius:28px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}

/* image */
.image-box{
    width:100%;
    height:430px;

    border-radius:21px;

    overflow:hidden;

    position:relative;

    background:#111;
}

.image-box img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;

    filter:brightness(.82) contrast(1.05);
}

.image-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(0,0,0,.75)
        );
}

/* image label */
.image-label{
    position:absolute;
    left:20px;
    bottom:20px;

    z-index:2;
}

.image-label small{
    display:block;

    color:#b8b8b8;

    font-size:9px;

    letter-spacing:2px;

    margin-bottom:6px;
}

.image-label strong{
    font-size:20px;
    letter-spacing:.5px;
}

/* content */
.content{
    text-align:center;

    padding:25px 15px 18px;
}

.badge{
    display:inline-block;

    padding:7px 12px;

    border-radius:50px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.04);

    color:#aaa;

    font-size:8px;

    letter-spacing:2px;

    margin-bottom:14px;
}

h1{
    font-size:34px;

    font-weight:800;

    letter-spacing:-1.5px;

    margin-bottom:9px;
}

.description{
    color:#929292;

    font-size:11px;

    line-height:1.7;

    max-width:330px;

    margin:auto;
}

/* button */
.join-btn{
    width:100%;

    margin-top:20px;

    padding:15px 18px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    text-decoration:none;

    color:#080808;

    background:#fff;

    border-radius:13px;

    font-size:11px;

    font-weight:800;

    letter-spacing:1px;

    transition:.25s ease;
}

.join-btn:hover{
    transform:translateY(-2px);

    background:#eeeeee;

    box-shadow:
        0 12px 30px rgba(255,255,255,.10);
}

.telegram{
    width:23px;
    height:23px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:#090909;

    color:#fff;

    font-size:11px;
}

/* footer */
.footer{
    margin-top:15px;

    color:#505050;

    font-size:8px;

    letter-spacing:1px;
}

/* mobile */
@media(max-width:480px){

    .page{
        padding:14px;
    }

    .card{
        max-width:420px;
        border-radius:24px;
        padding:9px;
    }

    .image-box{
        height:390px;
        border-radius:18px;
    }

    .content{
        padding:23px 12px 14px;
    }

    h1{
        font-size:31px;
    }
}

@media(max-height:720px){

    .image-box{
        height:330px;
    }

    .content{
        padding-top:18px;
    }

    h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="card">

        <!-- YOUR IMAGE -->
        <div class="image-box">

            <img
                src="IMG_20260509_223101_194.jpg"
                alt="Dragon Hub"
            >

            <div class="image-overlay"></div>

            <div class="image-label">

                <small>OFFICIAL COMMUNITY</small>

                <strong>DRAGON HUB</strong>

            </div>

        </div>


        <!-- CONTENT -->
        <div class="content">

            <div class="badge">
                WELCOME TO DRAGON HUB
            </div>

            <h1>DRAGON HUB</h1>

            <p class="description">
                Stay connected with the official Dragon Hub
                community and access the latest shared
                updates and content.
            </p>


            <a
                class="join-btn"
                href="https://t.me/+rcU1nqNlF6tjYTI9"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="telegram">➤</span>

                JOIN TELEGRAM

            </a>


            <div class="footer">
                © 2026 DRAGON HUB
            </div>

        </div>

    </div>

</div>

</body>
                </html>
