<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dragon Hub | Official Telegram Channel</title>
  <meta name="description" content="Dragon Hub Official Telegram Channel">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d7b45a;
      --gold-light: #f1d88a;
      --gold-dark: #94732a;
      --black: #050505;
      --black-2: #0b0b0b;
      --text: #f7f4ec;
      --muted: #9a978e;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--black);
      color: var(--text);
      overflow-x: hidden;
    }

    /* BACKGROUND */

    .page {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(215,180,90,0.075),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 110%,
          rgba(215,180,90,0.035),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          #020202 0%,
          #090909 48%,
          #030303 100%
        );
    }

    /* subtle luxury texture */

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .20;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 60px 60px;

      mask-image: radial-gradient(
        circle at center,
        black,
        transparent 75%
      );
    }

    /* decorative circles */

    .ring {
      position: absolute;
      border: 1px solid rgba(215,180,90,.07);
      border-radius: 50%;
      pointer-events: none;
    }

    .ring.one {
      width: 720px;
      height: 720px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .ring.two {
      width: 560px;
      height: 560px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-color: rgba(215,180,90,.045);
    }

    /* MAIN */

    .content {
      width: min(92%, 520px);
      position: relative;
      z-index: 5;
      text-align: center;

      padding: 45px 20px;
    }

    /* TOP LABEL */

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 9px 16px;

      border: 1px solid rgba(215,180,90,.30);
      border-radius: 100px;

      background: rgba(255,255,255,.025);

      color: #c9c4b8;

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 2.8px;
      text-transform: uppercase;

      backdrop-filter: blur(10px);

      margin-bottom: 30px;
    }

    .dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--gold-light);

      box-shadow:
        0 0 8px rgba(241,216,138,.8);
    }

    /* LOGO */

    .logo-wrap {
      width: 190px;
      height: 190px;

      margin: 0 auto 28px;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 45% 35%,
          #25221a 0%,
          #11100d 42%,
          #050505 72%
        );

      border: 1px solid rgba(215,180,90,.55);

      box-shadow:
        0 0 0 1px rgba(255,255,255,.025) inset,
        0 0 55px rgba(215,180,90,.09),
        0 20px 70px rgba(0,0,0,.65);
    }

    .logo-wrap::before {
      content: "";

      position: absolute;
      inset: 10px;

      border-radius: 50%;

      border: 1px solid rgba(215,180,90,.22);
    }

    .logo-wrap::after {
      content: "";

      position: absolute;
      inset: -12px;

      border-radius: 50%;

      border: 1px solid rgba(215,180,90,.055);
    }

    /*
      Premium CSS Dragon Emblem
    */

    .dragon {
      position: relative;

      width: 92px;
      height: 92px;

      color: var(--gold-light);

      filter:
        drop-shadow(0 0 10px rgba(215,180,90,.25))
        drop-shadow(0 7px 15px rgba(0,0,0,.8));
    }

    .dragon::before {
      content: "♛";

      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%) scaleX(1.35);

      font-family: Georgia, serif;

      font-size: 73px;

      line-height: 1;

      color: transparent;

      -webkit-text-stroke: 1.2px var(--gold-light);

      opacity: .92;
    }

    .dragon::after {
      content: "DRAGON";

      position: absolute;

      left: 50%;
      bottom: -8px;

      transform: translateX(-50%);

      font-size: 7px;
      font-weight: 700;

      letter-spacing: 3px;

      color: var(--gold-light);
    }

    /* BRAND */

    .brand {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(56px, 13vw, 78px);

      line-height: .8;

      letter-spacing: 5px;

      font-weight: 700;

      text-transform: uppercase;

      background:
        linear-gradient(
          180deg,
          #fff4c7 0%,
          #e7c76d 27%,
          #b88c32 58%,
          #f0d27c 82%,
          #9a7427 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      text-shadow:
        0 8px 30px rgba(0,0,0,.35);

      margin-bottom: 21px;
    }

    .brand-sub {
      font-size: 9px;

      font-weight: 600;

      letter-spacing: 5px;

      color: #aaa59a;

      text-transform: uppercase;

      margin-bottom: 28px;
    }

    /* DIVIDER */

    .divider {
      width: 120px;
      height: 1px;

      margin: 0 auto 25px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
    }

    /* DESCRIPTION */

    .description {
      max-width: 390px;

      margin: 0 auto;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.85;

      font-weight: 400;

      letter-spacing: .15px;

      margin-bottom: 31px;
    }

    /* CTA */

    .join-button {
      width: min(100%, 320px);

      min-height: 57px;

      margin: 0 auto;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      border-radius: 9px;

      position: relative;

      overflow: hidden;

      color: #100e08;

      background:
        linear-gradient(
          135deg,
          #f3dc93 0%,
          #d7b45a 38%,
          #a77d2a 100%
        );

      border: 1px solid rgba(255,236,168,.55);

      box-shadow:
        0 12px 35px rgba(0,0,0,.45),
        0 0 30px rgba(215,180,90,.10);

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 2.4px;

      text-transform: uppercase;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .join-button::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.32),
          transparent
        );

      transform: skewX(-20deg);

      transition: left .7s ease;
    }

    .join-button:hover::before {
      left: 140%;
    }

    .join-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 17px 40px rgba(0,0,0,.5),
        0 0 35px rgba(215,180,90,.18);
    }

    .telegram {
      width: 22px;
      height: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #111;

      color: #fff;

      font-size: 11px;
    }

    /* NOTE */

    .note {
      margin-top: 18px;

      color: #68665f;

      font-size: 9px;

      letter-spacing: 1.2px;

      text-transform: uppercase;
    }

    /* BOTTOM BRAND LINE */

    .bottom {
      position: absolute;

      bottom: 22px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 5;

      color: #4f4d47;

      font-size: 8px;

      letter-spacing: 3px;

      text-transform: uppercase;

      white-space: nowrap;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .content {
        padding: 30px 14px 55px;
      }

      .label {
        margin-bottom: 24px;
      }

      .logo-wrap {
        width: 160px;
        height: 160px;
        margin-bottom: 25px;
      }

      .dragon {
        transform: scale(.86);
      }

      .brand {
        font-size: 53px;
        letter-spacing: 3px;
      }

      .brand-sub {
        font-size: 8px;
        letter-spacing: 4px;
        margin-bottom: 23px;
      }

      .description {
        font-size: 12px;
        max-width: 330px;
        line-height: 1.75;
        margin-bottom: 27px;
      }

      .join-button {
        min-height: 55px;
      }

      .ring.one {
        width: 520px;
        height: 520px;
      }

      .ring.two {
        width: 400px;
        height: 400px;
      }

      .bottom {
        bottom: 12px;
        font-size: 7px;
      }
    }

    /* SMALL HEIGHT PHONES */

    @media (max-height: 700px) {

      .content {
        padding-top: 18px;
        padding-bottom: 40px;
      }

      .label {
        margin-bottom: 17px;
      }

      .logo-wrap {
        width: 135px;
        height: 135px;
        margin-bottom: 19px;
      }

      .dragon {
        transform: scale(.72);
      }

      .brand {
        font-size: 47px;
        margin-bottom: 15px;
      }

      .brand-sub {
        margin-bottom: 17px;
      }

      .divider {
        margin-bottom: 17px;
      }

      .description {
        margin-bottom: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .join-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="ring one"></div>
    <div class="ring two"></div>

    <div class="content">

      <!-- OFFICIAL LABEL -->
      <div class="label">
        <span class="dot"></span>
        Official Telegram Channel
      </div>

      <!-- PREMIUM LOGO -->
      <div class="logo-wrap">
        <div class="dragon"></div>
      </div>

      <!-- BRAND -->
      <h1 class="brand">
        Dragon Hub
      </h1>

      <div class="brand-sub">
        Daily Updates · Information · Insights
      </div>

      <div class="divider"></div>

      <!-- DESCRIPTION -->
      <p class="description">
        Stay connected with Dragon Hub for daily updates,
        useful information and timely notifications —
        all in one place.
      </p>

      <!-- MAIN CTA -->
      <a
        class="join-button"
        href="https://t.me/+mmDR9n1SDnxkNjJl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join Dragon Hub Telegram Channel"
      >
        <span class="telegram">➤</span>
        <span>Join Channel</span>
      </a>

      <div class="note">
        Connect with Dragon Hub on Telegram
      </div>

    </div>

    <div class="bottom">
      Dragon Hub · Official Channel
    </div>

  </main>

</body>
  </html>
