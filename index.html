<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dragon Hub</title>
  <meta name="description" content="Dragon Hub official Telegram channel.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #030609;
      --card: rgba(10, 17, 23, 0.72);
      --text: #f5faff;
      --muted: #87939e;
      --neon: #42d9ff;
      --neon-soft: rgba(66, 217, 255, 0.16);
      --border: rgba(66, 217, 255, 0.22);
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ---------- BACKGROUND ---------- */

    .page {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(35, 190, 235, 0.10),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #020406 0%,
          #05090d 50%,
          #020406 100%
        );
    }

    .glow {
      position: absolute;

      width: 420px;
      height: 420px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(45, 201, 240, 0.055);

      filter: blur(90px);

      pointer-events: none;
    }

    /* ---------- MAIN CARD ---------- */

    .container {
      width: min(92%, 440px);

      position: relative;
      z-index: 2;

      padding: 42px 28px 34px;

      text-align: center;

      border: 1px solid var(--border);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(18, 28, 35, 0.72),
          rgba(4, 8, 12, 0.88)
        );

      box-shadow:
        0 0 0 1px rgba(255,255,255,.015) inset,
        0 25px 80px rgba(0,0,0,.65),
        0 0 55px rgba(66,217,255,.055);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    /* ---------- TOP LINE ---------- */

    .top-line {
      width: 55px;
      height: 2px;

      margin: 0 auto 25px;

      background: var(--neon);

      box-shadow:
        0 0 8px var(--neon),
        0 0 22px rgba(66,217,255,.45);

      border-radius: 10px;
    }

    /* ---------- LOGO ---------- */

    .logo {
      width: 92px;
      height: 92px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border: 1px solid rgba(66,217,255,.35);

      background:
        radial-gradient(
          circle,
          rgba(66,217,255,.12),
          rgba(5,10,14,.95) 68%
        );

      box-shadow:
        0 0 25px rgba(66,217,255,.10),
        inset 0 0 25px rgba(66,217,255,.045);
    }

    .logo span {
      font-size: 34px;
      font-weight: 800;

      color: #eefaff;

      text-shadow:
        0 0 8px rgba(66,217,255,.75),
        0 0 24px rgba(66,217,255,.30);
    }

    /* ---------- BRAND ---------- */

    .brand {
      font-size: 34px;
      line-height: 1.1;

      font-weight: 800;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 10px;

      color: #f5faff;

      text-shadow:
        0 0 22px rgba(66,217,255,.08);
    }

    .brand span {
      color: var(--neon);

      text-shadow:
        0 0 10px rgba(66,217,255,.45),
        0 0 28px rgba(66,217,255,.16);
    }

    .subtitle {
      color: #7f8d98;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 25px;
    }

    /* ---------- DIVIDER ---------- */

    .divider {
      width: 100%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(66,217,255,.22),
          transparent
        );

      margin-bottom: 24px;
    }

    /* ---------- DESCRIPTION ---------- */

    .description {
      color: var(--muted);

      font-size: 13px;

      line-height: 1.8;

      max-width: 340px;

      margin: 0 auto 28px;
    }

    /* ---------- CTA ---------- */

    .join-btn {
      width: 100%;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      border-radius: 13px;

      border: 1px solid rgba(66,217,255,.65);

      background:
        linear-gradient(
          135deg,
          rgba(66,217,255,.15),
          rgba(66,217,255,.045)
        );

      color: #effbff;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-decoration: none;

      box-shadow:
        0 0 18px rgba(66,217,255,.10),
        0 0 45px rgba(66,217,255,.055);

      transition: all .3s ease;

      position: relative;

      overflow: hidden;
    }

    .join-btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.16),
          transparent
        );

      transform: skewX(-20deg);

      transition: .65s ease;
    }

    .join-btn:hover::before {
      left: 140%;
    }

    .join-btn:hover {
      transform: translateY(-2px);

      border-color: var(--neon);

      box-shadow:
        0 0 22px rgba(66,217,255,.22
