<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRAGON HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050608;
    --card:#0b0d10;

    --white:#ffffff;
    --muted:#9299a2;

    --blue:#39bfff;
    --blue2:#168cff;

    --line:rgba(255,255,255,.10);
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:var(--bg);
    color:white;
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}


/* =========================================
   BACKGROUND
========================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;
    z-index:-3;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}


/* =========================================
   AMBIENT NEON
========================================= */

.neon{
    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    pointer-events:none;

    filter:blur(120px);

    z-index:-2;

    opacity:.16;
}

.neon.one{
    background:#008cff;

    top:-250px;
    left:-220px;
}

.neon.two{
    background:#20c8ff;

    right:-260px;
    bottom:-220px;
}


/* =========================================
   MAIN PAGE
========================================= */

.page{
    min-height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px 16px;

    position:relative;
}


/* =========================================
   LANDING CARD
========================================= */

.card{
    width:100%;
    max-width:440px;

    position:relative;

    padding:10px;

    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 30px 100px rgba(0,0,0,.72),

        0 0 0 1px
        rgba(40,180,255,.10),

        0 0 35px
        rgba(0,145,255,.10);

    backdrop-filter:blur(12px);
}


/* =========================================
   TOP BRAND
========================================= */

.top{
    height:58px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 8px;
}

.brand{
    display:flex;

    align-items:center;

    gap:10px;

    font-size:11px;

    font-weight:800;

    letter-spacing:3px;
}

.brand-icon{
    width:31px;
    height:31px;

    display:grid;

    place-items:center;

    border-radius:9px;

    color:white;

    border:1px solid
        rgba(57,191,255,.55);

    background:
        rgba(20,150,255,.06);

    box-shadow:
        0 0 10px rgba(0,170,255,.35),

        inset 0 0 12px
        rgba(0,170,255,.08);
}

.status{
    display:flex;

    align-items:center;

    gap:7px;

    color:#686f78;

    font-size:7px;

    letter-spacing:1.7px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#45c8ff;

    box-shadow:
        0 0 7px #39bfff,
        0 0 16px #168cff;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.55;
        transform:scale(.85);
    }

    50%{
        opacity:1;
        transform:scale(1.1);
    }
}


/* =========================================
   IMAGE
========================================= */

.image-box{
    width:100%;

    height:470px;

    position:relative;

    overflow:hidden;

    border-radius:20px;

    background:#090b0e;

    border:1px solid
        rgba(57,191,255,.32);

    box-shadow:
        0 0 12px
        rgba(0,170,255,.30),

        0 0 40px
        rgba(0,120,255,.13),

        inset 0 0 25px
        rgba(0,170,255,.10);
}


/* Neon inner frame */

.image-box::before{
    content:"";

    position:absolute;

    inset:8px;

    z-index:4;

    border-radius:15px;

    border:1px solid
        rgba(80,205,255,.22);

    box-shadow:
        inset 0 0 22px
        rgba(0,170,255,.10);

    pointer-events:none;
}


/* Image */

.image-box img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    filter:
        brightness(.82)
        contrast(1.06)
        saturate(.78);

    transform:scale(1.02);

    transition:
        transform .8s ease,
        filter .8s ease;
}

.image-box:hover img{
    transform:scale(1.06);

    filter:
        brightness(.9)
        contrast(1.07)
        saturate(.9);
}


/* Image overlay */

.image-overlay{
    position:absolute;

    inset:0;

    z-index:2;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.04) 35%,
            rgba(0,0,0,.30) 58%,
            rgba(0,0,0,.88) 100%
        );

    pointer-events:none;
}


/* =========================================
   IMAGE BADGE
========================================= */

.image-badge{
    position:absolute;

    top:20px;
    left:20px;

    z-index:8;

    display:flex;

    align-items:center;

    gap:7px;

    padding:8px 11px;

    border-radius:50px;

    color:#b9eaff;

    background:
        rgba(4,9,13,.62);

    border:1px solid
        rgba(57,191,255,.35);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 15px
        rgba(0,160,255,.15);

    font-size:7px;

    font-weight:700;

    letter-spacing:1.8px;
}

.badge-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#49c9ff;

    box-shadow:
        0 0 8px #39bfff;
}


/* =========================================
   IMAGE TEXT
========================================= */

.image-text{
    position:absolute;

    z-index:8;

    left:23px;
    right:23px;
    bottom:22px;
}

.image-text small{
    display:block;

    color:#a0a6ae;

    font-size:7px;

    letter-spacing:2.5px;

    margin-bottom:6px;
}

.image-text strong{
    display:block;

    font-size:27px;

    font-weight:800;

    letter-spacing:-.7px;

    text-shadow:
        0 0 10px
        rgba(255,255,255,.18),

        0 0 28px
        rgba(0,170,255,.22);
}


/* =========================================
   CONTENT
========================================= */

.content{
    padding:24px 14px 17px;

    text-align:center;
}

.mini-title{
    display:inline-block;

    color:#8fdfff;

    font-size:7px;

    font-weight:700;

    letter-spacing:2.5px;

    margin-bottom:11px;

    text-shadow:
        0 0 10px
        rgba(0,180,255,.45);
}

h1{
    font-size:31px;

    font-weight:800;

    letter-spacing:-1.3px;

    line-height:1.1;

    margin-bottom:9px;

    text-shadow:
        0 0 8px
        rgba(255,255,255,.15),

        0 0 25px
        rgba(0,160,255,.16);
}

.description{
    max-width:330px;

    margin:0 auto;

    color:#858c95;

    font-size:10.5px;

    line-height:1.75;
}


/* =========================================
   CTA
========================================= */

.join{
    width:100%;

    min-height:54px;

    margin-top:19px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    position:relative;

    overflow:hidden;

    text-decoration:none;

    color:#fff;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            rgba(24,160,255,.17),
            rgba(15,89,255,.08)
        );

    border:1px solid
        rgba(65,199,255,.65);

    box-shadow:
        0 0 10px
        rgba(0,170,255,.38),

        0 0 28px
        rgba(0,120,255,.17),

        inset 0 0 18px
        rgba(0,170,255,.07);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.7px;

    transition:.3s ease;
}


/* animated shine */

.join::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3.5s infinite;
}

@keyframes shine{

    0%{
        left:-100%;
    }

    45%,100%{
        left:140%;
    }
}

.join:hover{

    transform:translateY(-2px);

    border-color:#8cddff;

    box-shadow:
        0 0 15px
        rgba(0,190,255,.65),

        0 0 45px
        rgba(0,130,255,.25),

        inset 0 0 20px
        rgba(0,170,255,.10);
}

.telegram-icon{
    width:27px;
    height:27px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:#fff;

    color:#087cc1;

    font-size:12px;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.22);
}


/* =========================================
   FOOTER
========================================= */

.footer{
    margin-top:15px;

    color:#484e55;

    font-size:7px;

    letter-spacing:1.7px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

    .page{
        padding:12px;
    }

    .card{
        padding:8px;

        border-radius:24px;
    }

    .top{
        height:54px;
    }

    .brand{
        font-size:10px;

        letter-spacing:2.5px;
    }

    .brand-icon{
        width:30px;
        height:30px;
    }

    .image-box{
        height:430px;

        border-radius:18px;
    }

    .image-text strong{
        font-size:24px;
    }

    .content{
        padding:22px 11px 14px;
    }

    h1{
        font-size:28px;
    }

    .description{
        font-size:10px;
    }

}


/* Short screens */

@media(max-height:720px){

    .image-box{
        height:360px;
    }

    .content{
        padding-top:18px;
    }
}

</style>
</head>

</div>

</body>
    </html>
