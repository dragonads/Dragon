  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dragon Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #030507;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      position: relative;
      overflow: hidden;
    }

    /* BLUE NEON LIGHT */

    .page::before {
      content: "";
      position: absolute;

      width: 420px;
      height: 420px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: rgba(0, 200, 255, 0.08);

      filter: blur(90px);
    }

    /* MAIN BOX */

    .box {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 430px;

      padding: 45px 28px 35px;

      text-align: center;

      background: rgba(8, 13, 18, 0.94);

      border: 1px solid rgba(55, 205, 255, 0.28);

      border-radius: 24px;

      box-shadow:
        0 0 40px rgba(0, 200, 255, 0.07),
        0 25px 70px rgba(0, 0, 0, 0.75);
    }

    /* LOGO */

    .logo {
      width: 105px;
      height: 105px;

      margin: 0 auto 25px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #17232c,
          #05090d
        );

      border: 1px solid rgba(73, 213, 255, 0.55);

      box-shadow:
        0 0 20px rgba(50, 205, 255, 0.18),
        inset 0 0 25px rgba(50, 205, 255, 0.08);
    }

    .logo-text {
      font-size: 27px;
      font-weight: 900;

      letter-spacing: 2px;

      color: white;

      text-shadow:
        0 0 8px #4ddcff,
        0 0 22px rgba(77, 220, 255, 0.55);
    }

    /* TITLE */

    h1 {
      font-size: 36px;

      font-weight: 800;

      letter-spacing: 3px;

      margin-bottom: 10px;
    }

    h1 span {
      color: #50d9ff;

      text-shadow:
        0 0 10px rgba(80, 217, 255, 0.55);
    }

    /* SMALL TITLE */

    .small-title {
      color: #7e8b96;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 25px;
    }

    /* LINE */

    .line {
      width: 90px;
      height: 1px;

      margin: 0 auto 24px;

      background: #42d7ff;

      box-shadow:
        0 0 10px #42d7ff;
    }

    /* DESCRIPTION */

    .description {
      color: #89959e;

      font-size: 13px;

      line-height: 1.8;

      margin-bottom: 28px;
    }

    /* BUTTON */

    .join {
      display: flex;

      width: 100%;
      height: 56px;

      align-items: center;
      justify-content: center;

      gap: 10px;

      border-radius: 12px;

      background: #08131a;

      border: 1px solid #42d7ff;

      color: white;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 2px;

      text-decoration: none;

      text-transform: uppercase;

      box-shadow:
        0 0 12px rgba(66, 215, 255, 0.22),
        0 0 35px rgba(66, 215, 255, 0.08);

      transition: 0.25s;
    }

    .join:hover {
      transform: translateY(-2px);

      background: #0b1c25;

      box-shadow:
        0 0 18px rgba(66, 215, 255, 0.35),
        0 0 45px rgba(66, 215, 255, 0.14);
    }

    .telegram {
      width: 23px;
      height: 23px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #159bd3;

      font-size: 11px;
    }

    /* FOOTER */

    .footer {
      margin-top: 18px;

      color: #3f4a53;

      font-size: 8px;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .box {
        padding: 38px 22px 30px;
      }

      .logo {
        width: 90px;
        height: 90px;
      }

      h1 {
        font-size: 31px;
        letter-spacing: 2px;
      }

      .description {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="box">

      <div <img src="./IMG_20260828_225104_734.jpg" alt="Dragon Hub Logo">

      <h1>
        DRAGON <span>HUB</span>
      </h1>

      <div class="small-title">
        Official Telegram Channel
      </div>

      <div class="line"></div>

      <p class="description">
        Stay connected with Dragon Hub for daily
        updates, useful information and timely
        notifications — all in one place.
      </p>

      <a
        class="join"
        href="https://t.me/+mmDR9n1SDnxkNjJl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="telegram">➤</span>
        <span>Join Channel</span>
      </a>

      <div class="footer">
        Dragon Hub · Telegram
      </div>

    </div>

  </div>

</body>
</html>
