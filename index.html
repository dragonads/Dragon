<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dragon Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:#020407;
  color:#fff;
  font-family:Inter,sans-serif;
  overflow:hidden;
}

.page{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(42,180,235,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(24,125,175,.08),
      transparent 38%
    ),
    #020407;
}

/* ambient glow */

.glow{
  position:absolute;
  width:430px;
  height:430px;
  border-radius:50%;
  background:rgba(42,190,245,.09);
  filter:blur(90px);
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* subtle rings */

.ring{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(91,205,255,.07);
  border-radius:50%;
}

.ring1{
  width:700px;
  height:700px;
}

.ring2{
  width:500px;
  height:500px;
}

/* content */

.content{
  width:92%;
  max-width:500px;
  text-align:center;
  position:relative;
  z-index:5;
}

/* label */

.label{
  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:9px 16px;

  border:1px solid rgba(94,210,255,.22);
  border-radius:50px;

  color:#8d9aa6;
  background:rgba(255,255,255,.025);

  font-size:8px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;

  margin-bottom:28px;
}

.label i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#69d9ff;
  box-shadow:0 0 12px #35c9ff;
}

/* dragon logo */

.logo{
  width:190px;
  height:190px;

  margin:0 auto 27px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  background:
    radial-gradient(
      circle at 50% 35%,
      #202b34,
      #080d12 55%,
      #020407 80%
    );

  border:1px solid rgba(103,211,255,.42);

  box-shadow:
    0 0 35px rgba(45,186,240,.12),
    0 25px 70px rgba(0,0,0,.7),
    inset 0 0 35px rgba(0,0,0,.9);
}

.logo:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(107,215,255,.18);
}

/* dragon */

.dragon{
  position:relative;
  width:100px;
  height:115px;
  filter:drop-shadow(0 0 14px rgba(71,205,255,.28));
}

/* head */

.head{
  position:absolute;
  width:43px;
  height:54px;
  left:29px;
  top:17px;

  background:linear-gradient(
    145deg,
    #eaf4f8,
    #8496a3 42%,
    #26323a 70%,
    #080c10
  );

  clip-path:polygon(
    50% 0,
    78% 17%,
    100% 48%,
    75% 63%,
    67% 100%,
    50% 77%,
    33% 100%,
    25% 63%,
    0 48%,
    22% 17%
  );
}

/* wings */

.wing{
  position:absolute;
  width:57px;
  height:70px;
  top:31px;

  background:linear-gradient(
    140deg,
    #c6d3db,
    #485862 48%,
    #0a1015 85%
  );
}

.left{
  left:-2px;
  clip-path:polygon(
    100% 48%,
    58% 32%,
    0 0,
    18% 45%,
    0 100%,
    63% 74%
  );
}

.right{
  right:-2px;
  clip-path:polygon(
    0 48%,
    42% 32%,
    100% 0,
    82% 45%,
    100% 100%,
    37% 74%
  );
}

/* body */

.body{
  position:absolute;
  width:39px;
  height:70px;
  left:31px;
  top:50px;

  border-left:8px solid #687b88;
  border-right:5px solid #18232b;

  border-radius:35%;
}

/* eye */

.eye{
  position:absolute;
  width:5px;
  height:5px;
  background:#dff8ff;
  border-radius:50%;

  left:50px;
  top:39px;

  box-shadow:
    0 0 6px #fff,
    0 0 15px #43ceff;

  z-index:5;
}

/* logo light */

.logo-light{
  position:absolute;

  width:78px;
  height:2px;

  bottom:13px;
  left:50%;
  transform:translateX(-50%);

  background:linear-gradient(
    90deg,
    transparent,
    #5ed7ff,
    transparent
  );

  box-shadow:0 0 12px rgba(74,207,255,.5);
}

/* title */

.title{
  font-family:Cinzel,serif;

  font-size:clamp(46px,12vw,70px);

  font-weight:700;

  letter-spacing:6px;

  line-height:1;

  color:#f4f7fa;

  text-transform:uppercase;

  text-shadow:
    0 0 20px rgba(255,255,255,.06),
    0 12px 35px rgba(0,0,0,.8);

  margin-bottom:14px;
}

.title span{
  color:#72d9ff;

  text-shadow:
    0 0 12px rgba(72,205,255,.55),
    0 0 30px rgba(72,205,255,.18);
}

/* tagline */

.tagline{
  color:#768490;

  font-size:8px;
  font-weight:600;

  letter-spacing:4px;

  text-transform:uppercase;

  margin-bottom:23px;
}

/* divider */

.divider{
  width:125px;
  height:1px;

  margin:0 auto 22px;

  background:linear-gradient(
    90deg,
    transparent,
    #56cfff,
    transparent
  );

  box-shadow:0 0 10px rgba(67,203,255,.3);
}

/* description */

.description{
  max-width:360px;
  margin:0 auto 28px;

  color:#798692;

  font-size:12px;
  line-height:1.8;
}

/* button */

.join{
  width:min(100%,315px);
  height:57px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;

  border-radius:9px;

  color:#f5fbff;

  background:
    linear-gradient(
      135deg,
      #15212a,
      #070c11
    );

  border:1px solid rgba(91,210,255,.55);

  box-shadow:
    0 0 25px rgba(46,188,239,.10),
    0 15px 40px rgba(0,0,0,.6);

  font-size:11px;
  font-weight:800;
  letter-spacing:2.5px;

  text-transform:uppercase;

  transition:.3s ease;
}

.join:hover{
  transform:translateY(-3px);

  border-color:#79dcff;

  box-shadow:
    0 0 35px rgba(46,188,239,.2),
    0 18px 45px rgba(0,0,0,.7);
}

.telegram{
  width:21px;
  height:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#159bd3;

  font-size:10px;

  box-shadow:0 0 12px rgba(31,183,237,.4);
}

.note{
  margin-top:14px;

  color:#414b54;

  font-size:8px;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

/* bottom */

.bottom{
  position:absolute;

  bottom:16px;
  left:50%;

  transform:translateX(-50%);

  color:#30383f;

  font-size:7px;
  letter-spacing:3px;

  white-space:nowrap;
}

/* mobile */

@media(max-width:480px){

  .content{
    width:90%;
  }

  .label{
    margin-bottom:20px;
  }

  .logo{
    width:160px;
    height:160px;
    margin-bottom:22px;
  }

  .title{
    font-size:45px;
    letter-spacing:4px;
  }

  .tagline{
    font-size:7px;
    letter-spacing:3px;
  }

  .description{
    font-size:11px;
    max-width:320px;
  }

  .ring1{
    width:540px;
    height:540px;
  }

  .ring2{
    width:390px;
    height:390px;
  }
}

@media(max-height:700px){

  .label{
    margin-bottom:12px;
  }

  .logo{
    width:125px;
    height:125px;
    margin-bottom:14px;
  }

  .dragon{
    transform:scale(.65);
  }

  .title{
    font-size:40px;
  }

  .tagline{
    margin-bottom:13px;
  }

  .divider{
    margin-bottom:13px;
  }

  .description{
    margin-bottom:16px;
  }

  .join{
    height:51px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="glow"></div>

  <div class="ring ring1"></div>
  <div class="ring ring2"></div>

  <div class="content">

    <div class="label">
      <i></i>
      Official Telegram Channel
    </div>

    <div class="logo">

      <div class="dragon">

        <div class="wing left"></div>
        <div class="wing right"></div>

        <div class="body"></div>

        <div class="head"></div>

        <div class="eye"></div>

        <div class="logo-light"></div>

      </div>

    </div>

    <h1 class="title">
      DRAGON <span>HUB</span>
    </h1>

    <div class="tagline">
      Daily Updates · Information · Insights
    </div>

    <div class="divider"></div>

    <p class="description">
      Stay connected with Dragon Hub for daily updates,
      useful information and timely notifications —
      all in one place.
    </p>

    <a
      class="join"
      href="https://t.me/+mmDR9n1SDnxkNjJl"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram">➤</span>
      JOIN CHANNEL
    </a>

    <div class="note">
      Connect with Dragon Hub on Telegram
    </div>

  </div>

  <div class="bottom">
    DRAGON HUB · OFFICIAL
  </div>

</div>

</body>
  </html>
