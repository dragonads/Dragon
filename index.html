<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRAGON HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050608;
    --white:#ffffff;
    --muted:#8d949d;
    --blue:#39bfff;
    --blue2:#168cff;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:var(--bg);
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}


/* ================================
   BACKGROUND GRID
================================ */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );
}


/* ================================
   BLUE NEON AMBIENT LIGHT
================================ */

.neon{
    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.16;

    pointer-events:none;

    z-index:-3;
}

.neon.one{
    background:#008cff;

    top:-250px;
    left:-220px;
}

.neon.two{
    background:#20c8ff;

    right:-260px;
    bottom:-220px;
}


/* ================================
   PAGE
================================ */

.page{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px 14px;

    position:relative;
}


/* ================================
   MAIN CARD
================================ */

.card{
    width:100%;
    max-width:450px;

    padding:10px;

    border-radius:28px;

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.10);

    box-shadow:
        0 30px 100px rgba(0,0,0,.72),
        0 0 0 1px rgba(40,180,255,.10),
        0 0 40px rgba(0,145,255,.10);

    backdrop-filter:blur(12px);
}


/* ================================
   TOP
================================ */

.top{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 8px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:11px;
    font-weight:800;
    letter-spacing:3px;
}

.brand-icon{
    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    border-radius:9px;

    color:#fff;

    border:1px solid rgba(57,191,255,.60);

    background:rgba(20,150,255,.06);

    box-shadow:
        0 0 10px rgba(0,170,255,.35),
        inset 0 0 12px rgba(0,170,255,.08);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    color:#686f78;

    font-size:7px;
    letter-spacing:1.7px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#45c8ff;

    box-shadow:
        0 0 8px #39bfff,
        0 0 18px #168cff;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.55;
        transform:scale(.85);
    }

    50%{
        opacity:1;
        transform:scale(1.15);
    }
}


/* ================================
   IMAGE
================================ */

.image-box{
    width:100%;
    height:465px;

    position:relative;

    overflow:hidden;

    border-radius:21px;

    background:#090b0e;

    border:1px solid rgba(57,191,255,.40);

    box-shadow:
        0 0 13px rgba(0,170,255,.32),
        0 0 42px rgba(0,120,255,.15),
        inset 0 0 28px rgba(0,170,255,.10);
}


/* Inner neon frame */

.image-box::before{
    content:"";

    position:absolute;
    inset:8px;

    z-index:5;

    border-radius:15px;

    border:1px solid rgba(80,205,255,.23);

    box-shadow:
        inset 0 0 24px rgba(0,170,255,.11);

    pointer-events:none;
}


/* Image */

.image-box img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
    object-position:center;

    filter:
        brightness(.83)
        contrast(1.06)
        saturate(.78);

    transform:scale(1.02);

    transition:
        transform .8s ease,
        filter .8s ease;
}

.image-box:hover img{
    transform:scale(1.06);

    filter:
        brightness(.92)
        contrast(1.07)
        saturate(.90);
}


/* Image overlay */

.image-overlay{
    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02) 30%,
            rgba(0,0,0,.30) 60%,
            rgba(0,0,0,.88) 100%
        );
}


/* ================================
   IMAGE BADGE
================================ */

.image-badge{
    position:absolute;

    top:20px;
    left:20px;

    z-index:8;

    display:flex;
    align-items:center;
    gap:7px;

    padding:9px 12px;

    border-radius:50px;

    color:#b9eaff;

    background:rgba(4,9,13,.65);

    border:1px solid rgba(57,191,255,.38);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 17px rgba(0,160,255,.16);

    font-size:7px;
    font-weight:700;
    letter-spacing:1.8px;
}

.badge-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#49c9ff;

    box-shadow:
        0 0 8px #39bfff;
}


/* ================================
   IMAGE TITLE
================================ */

.image-text{
    position:absolute;

    z-index:8;

    left:24px;
    right:24px;
    bottom:23px;
}

.image-text small{
    display:block;

    color:#a0a6ae;

    font-size:7px;
    letter-spacing:2.5px;

    margin-bottom:6px;
}

.image-text strong{
    display:block;

    font-size:28px;
    font-weight:800;

    letter-spacing:-.7px;

    text-shadow:
        0 0 10px rgba(255,255,255,.18),
        0 0 30px rgba(0,170,255,.23);
}


/* ================================
   CONTENT
================================ */

.content{
    padding:24px 14px 17px;

    text-align:center;
}

.mini-title{
    display:inline-block;

    color:#8fdfff;

    font-size:7px;
    font-weight:700;

    letter-spacing:2.5px;

    margin-bottom:11px;

    text-shadow:
        0 0 10px rgba(0,180,255,.45);
}

h1{
    font-size:32px;

    font-weight:800;

    letter-spacing:-1.4px;

    line-height:1.1;

    margin-bottom:9px;

    text-shadow:
        0 0 8px rgba(255,255,255,.16),
        0 0 25px rgba(0,160,255,.18);
}

.description{
    max-width:340px;

    margin:0 auto;

    color:#858c95;

    font-size:10.5px;

    line-height:1.75;
}


/* ================================
   LARGE TELEGRAM BUTTON
================================ */

.join{
    width:100%;
    height:64px;

    margin-top:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;

    position:relative;
    overflow:hidden;

    text-decoration:none;

    color:#fff;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            rgba(35,175,255,.23),
            rgba(10,105,255,.12)
        );

    border:1px solid rgba(75,205,255,.82);

    box-shadow:
        0 0 12px rgba(0,175,255,.48),
        0 0 34px rgba(0,125,255,.23),
        inset 0 0 22px rgba(0,180,255,.09);

    font-size:12px;
    font-weight:800;

    letter-spacing:2px;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}


/* Animated shine */

.join::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:65%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.14),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3.5s infinite;
}

@keyframes shine{

    0%{
        left:-100%;
    }

    45%,
    100%{
        left:140%;
    }
}


.join:hover{
    transform:translateY(-3px);

    border-color:#8cddff;

    box-shadow:
        0 0 17px rgba(0,195,255,.72),
        0 0 48px rgba(0,135,255,.32),
        inset 0 0 25px rgba(0,180,255,.12);
}


/* Telegram icon */

.telegram-icon{
    width:33px;
    height:33px;

    display:grid;
    place-items:center;

    flex-shrink:0;

    border-radius:50%;

    background:#fff;

    color:#087cc1;

    font-size:14px;

    box-shadow:
        0 0 15px rgba(255,255,255,.32);
}


/* ================================
   FOOTER
================================ */

.footer{
    margin-top:15px;

    color:#484e55;

    font-size:7px;

    letter-spacing:1.7px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:480px){

    .page{
        padding:10px;
    }

    .card{
        padding:8px;

        border-radius:24px;
    }

    .top{
        height:54px;
    }

    .brand{
        font-size:10px;
        letter-spacing:2.5px;
    }

    .brand-icon{
        width:30px;
        height:30px;
    }

    .image-box{
        height:425px;

        border-radius:18px;
    }

    .image-text{
        left:21px;
        right:21px;
        bottom:21px;
    }

    .image-text strong{
        font-size:25px;
    }

    .content{
        padding:22px 11px 14px;
    }

    h1{
        font-size:29px;
    }

    .description{
        font-size:10px;
    }

    .join{
        height:64px;

        font-size:12px;

        border-radius:14px;
    }

    .telegram-icon{
        width:34px;
        height:34px;
    }
}


/* ================================
   VERY SMALL PHONES
================================ */

@media(max-width:360px){

    .image-box{
        height:380px;
    }

    .join{
        height:60px;

        font-size:11px;

        letter-spacing:1.5px;
    }

    .telegram-icon{
        width:31px;
        height:31px;
    }
}


/* ================================
   SHORT SCREEN
================================ */

@media(max-height:700px){

    .image-box{
        height:350px;
    }

    .content{
        padding-top:18px;
    }

    h1{
        font-size:27px;
    }

    .join{
        height:60px;
    }
}

</style>
