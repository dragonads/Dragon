<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRAGON HUB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#080909;
    color:#fff;
    font-family:Inter,sans-serif;
    overflow-x:hidden;
}

/* ================================
   BACKGROUND
================================ */

.page{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 70% 45%,
            rgba(92,255,158,.10),
            transparent 30%
        ),
        #080909;
}

.page:before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );
    background-size:70px 70px;
    mask-image:linear-gradient(
        to bottom,
        rgba(0,0,0,.8),
        transparent 90%
    );
    pointer-events:none;
}

/* ================================
   NAV
================================ */

nav{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:90px;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5vw;
}

.nav-logo{
    display:flex;
    align-items:center;
    gap:12px;

    font-size:12px;
    font-weight:800;
    letter-spacing:4px;
}

.mark{
    width:36px;
    height:36px;

    display:grid;
    place-items:center;

    border:1px solid rgba(151,255,194,.4);
    border-radius:50%;

    color:#9affc3;
    font-size:17px;

    box-shadow:
        0 0 25px rgba(151,255,194,.1);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.nav-status{
    font-size:9px;
    letter-spacing:2px;
    color:#69736d;
}

.nav-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#8effb9;
    box-shadow:0 0 15px #8effb9;
}

/* ================================
   MAIN
================================ */

.main{
    position:relative;
    min-height:100vh;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* Giant background word */

.bg-word{
    position:absolute;
    z-index:0;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-90deg);

    font-family:"Barlow Condensed",sans-serif;

    font-size:min(35vw,500px);

    font-weight:900;

    letter-spacing:-20px;

    color:transparent;

    -webkit-text-stroke:1px rgba(255,255,255,.045);

    white-space:nowrap;

    user-select:none;
}

/* ================================
   CONTENT
================================ */

.content{
    position:relative;
    z-index:5;

    width:min(1250px,90vw);

    min-height:100vh;

    display:grid;
    grid-template-columns:42% 58%;

    align-items:center;
}

/* ================================
   LEFT TEXT
================================ */

.left{
    position:relative;
    z-index:8;
    padding-left:3vw;
}

.eyebrow{
    display:flex;
    align-items:center;
    gap:12px;

    color:#93ffbb;

    font-size:9px;
    font-weight:700;

    letter-spacing:4px;

    margin-bottom:24px;
}

.eyebrow-line{
    width:35px;
    height:1px;
    background:#93ffbb;
}

.title{
    font-family:"Barlow Condensed",sans-serif;

    font-size:clamp(90px,12vw,170px);

    font-weight:900;

    line-height:.73;

    letter-spacing:-5px;

    text-transform:uppercase;
}

.title .one{
    display:block;
}

.title .two{
    display:block;

    margin-left:55px;

    color:#9affc2;

    text-shadow:
        0 0 45px rgba(126,255,174,.13);
}

.description{
    width:390px;
    max-width:100%;

    margin-top:40px;

    color:#7e8882;

    font-size:12px;

    line-height:1.9;
}

/* ================================
   CTA
================================ */

.join{
    display:inline-flex;
    align-items:center;
    gap:17px;

    margin-top:30px;

    padding:6px 7px 6px 20px;

    color:#06100a;

    background:#9affc2;

    text-decoration:none;

    font-size:10px;
    font-weight:800;

    letter-spacing:1.5px;

    border-radius:100px;

    transition:.3s ease;
}

.join:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 45px rgba(127,255,174,.2);
}

.join-arrow{
    width:34px;
    height:34px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:#07100a;

    color:#9affc2;

    font-size:15px;
}

/* ================================
   IMAGE AREA
================================ */

.right{
    position:relative;

    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;
}

.image-wrap{
    position:relative;

    width:min(510px,75%);
    height:76vh;

    max-height:720px;

    overflow:hidden;

    transform:rotate(2deg);

    border:1px solid rgba(255,255,255,.13);

    box-shadow:
        0 40px 100px rgba(0,0,0,.65);
}

.image-wrap:before{
    content:"";

    position:absolute;
    inset:0;
    z-index:2;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.03) 25%,
            rgba(0,0,0,.65) 100%
        );
}

.image-wrap:after{
    content:"";

    position:absolute;
    inset:12px;

    z-index:3;

    border:1px solid rgba(154,255,194,.15);

    pointer-events:none;
}

.hero-img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    transform:scale(1.04);

    filter:
        contrast(1.06)
        saturate(.82);

    transition:1s ease;
}

.image-wrap:hover .hero-img{
    transform:scale(1.09);
}

/* Image bottom info */

.image-info{
    position:absolute;
    z-index:6;

    left:30px;
    right:30px;
    bottom:28px;

    display:flex;
    align-items:end;
    justify-content:space-between;
}

.image-info small{
    display:block;

    color:#94a099;

    font-size:7px;

    letter-spacing:3px;

    margin-bottom:7px;
}

.image-info strong{
    font-family:"Barlow Condensed",sans-serif;

    font-size:25px;

    letter-spacing:1px;
}

/* ================================
   FLOATING LABELS
================================ */

.label-top{
    position:absolute;
    z-index:10;

    top:15%;
    right:-35px;

    padding:14px 18px;

    background:rgba(8,10,9,.72);

    border:1px solid rgba(255,255,255,.1);

    backdrop-filter:blur(15px);

    transform:rotate(2deg);
}

.label-top span{
    display:block;

    color:#68726c;

    font-size:7px;

    letter-spacing:2px;

    margin-bottom:5px;
}

.label-top strong{
    font-size:10px;

    letter-spacing:1px;
}

/* Side vertical */

.side-text{
    position:absolute;

    right:2vw;
    bottom:12%;

    writing-mode:vertical-rl;

    color:#47504b;

    font-size:8px;

    letter-spacing:4px;
}

/* ================================
   BOTTOM
================================ */

.bottom{
    position:absolute;

    z-index:10;

    bottom:30px;
    left:5vw;
    right:5vw;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.bottom-left{
    display:flex;
    align-items:center;
    gap:15px;

    color:#4d5852;

    font-size:8px;

    letter-spacing:2px;
}

.line{
    width:45px;
    height:1px;
    background:#3e4742;
}

.bottom-right{
    color:#4d5852;

    font-family:"Barlow Condensed",sans-serif;

    font-size:17px;

    letter-spacing:2px;
}

/* ================================
   MOBILE
================================ */

@media(max-width:850px){

    .page{
        min-height:100svh;
    }

    nav{
        height:75px;
        padding:0 6vw;
    }

    .nav-status{
        display:none;
    }

    .content{
        width:90vw;

        display:flex;
        flex-direction:column;

        align-items:stretch;

        padding-top:110px;
        padding-bottom:80px;
    }

    .left{
        padding:0;

        text-align:center;
    }

    .eyebrow{
        justify-content:center;
    }

    .title{
        font-size:82px;
        letter-spacing:-3px;
    }

    .title .two{
        margin-left:30px;
    }

    .description{
        margin:32px auto 0;

        font-size:11px;

        max-width:340px;
    }

    .join{
        margin-top:25px;

        width:100%;

        justify-content:space-between;

        padding-left:22px;
    }

    .right{
        height:500px;

        margin-top:35px;
    }

    .image-wrap{
        width:82%;
        height:480px;

        transform:rotate(1deg);
    }

    .label-top{
        right:0;
        top:8%;
    }

    .side-text{
        display:none;
    }

    .bg-word{
        font-size:60vw;
    }

    .bottom{
        bottom:18px;
    }

    .bottom-right{
        font-size:13px;
    }
}

@media(max-width:430px){

    .title{
        font-size:70px;
    }

    .right{
        height:450px;
    }

    .image-wrap{
        height:430px;
        width:86%;
    }

    .image-info{
        left:20px;
        right:20px;
        bottom:20px;
    }

    .image-info strong{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- BACKGROUND -->
    <div class="bg-word">
        DRAGON
    </div>


    <!-- NAV -->
    <nav>

        <div class="nav-logo">

            <div class="mark">D</div>

            DRAGON HUB

        </div>

        <div class="nav-right">

            <div class="nav-status">
                OFFICIAL TELEGRAM
            </div>

            <div class="nav-dot"></div>

        </div>

    </nav>


    <!-- MAIN -->
    <main
